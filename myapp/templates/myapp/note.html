{% load static %}
<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Note {{ note.slug }}</title>
    <script>
        const savedTheme = localStorage.getItem("note-theme");
        document.documentElement.dataset.theme = ["dark", "light", "telegram"].includes(savedTheme)
            ? savedTheme
            : "dark";
    </script>
    <link rel="stylesheet" href="{% static 'myapp/note.css' %}">
</head>
<body>
    <div class="ambient-glow ambient-glow-one" aria-hidden="true"></div>
    <div class="ambient-glow ambient-glow-two" aria-hidden="true"></div>
    <div class="noise-overlay" aria-hidden="true"></div>
    <main class="page">
        <section class="note-card">
            <header class="toolbar">
                <a class="brand" href="/" aria-label="Create a new note">
                    <span class="brand-mark">n</span>
                    <span class="brand-copy">
                        <strong>notepad</strong>
                        <small>private workspace</small>
                    </span>
                </a>

                <div class="search-box" role="search">
                    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/>
                    </svg>
                    <input
                        id="note-search"
                        class="search-input"
                        type="search"
                        placeholder="Search note..."
                        aria-label="Search note text"
                        autocomplete="off"
                    >
                    <span id="search-count" class="search-count" aria-live="polite"></span>
                </div>

                <div class="toolbar-actions">
                    <span
                        id="save-status"
                        class="save-status"
                        data-state="saved"
                        role="status"
                        aria-live="polite"
                    >Saved</span>
                    <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch theme" title="Switch theme">
                        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="4"/>
                            <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
                        </svg>
                        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20.5 15.6A9 9 0 0 1 8.4 3.5 9 9 0 1 0 20.5 15.6Z"/>
                        </svg>
                    </button>
                    <button id="copy-url" class="action-button" type="button">Copy URL</button>
                    <label class="slug-picker" for="slug-select">
                        <span>Slug</span>
                        <select id="slug-select" class="slug-select" data-current-slug="{{ note.slug }}" aria-label="Choose static note slug">
                            <option value="">Auto: {{ note.slug }}</option>
                            {% for static_slug in static_note_slugs %}
                                <option value="{% url 'note_detail' slug=static_slug %}"{% if static_slug == note.slug %} selected{% endif %}>{{ static_slug }}</option>
                            {% endfor %}
                        </select>
                    </label>
                    <label class="password-box" for="note-password">
                        <span class="password-field">
                            <input
                                id="note-password"
                                class="password-input"
                                type="password"
                                placeholder="Password"
                                autocomplete="new-password"
                                aria-label="Note password"
                            >
                            <button class="password-eye" type="button" data-password-toggle="note-password" aria-label="Show password" title="Show password">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
                                    <circle cx="12" cy="12" r="2.5"/>
                                </svg>
                            </button>
                        </span>
                        <button id="set-password" class="mini-button" type="button">Lock</button>
                        <button id="clear-password" class="mini-button danger-button" type="button"{% if not has_password %} hidden{% endif %}>Remove</button>
                    </label>
                    <label class="history-picker" for="history-select">
                        <span>History</span>
                        <select id="history-select" class="history-select" aria-label="Choose note history version">
                            <option value="">No history</option>
                        </select>
                        <button id="restore-history" class="mini-button" type="button" disabled>Restore</button>
                    </label>
                    <button id="copy-text" class="action-button" type="button">Copy Text</button>
                    <label id="attach-label" class="action-button attach-button primary-action" aria-live="polite">
                        <span class="attach-label-text">Attach File</span>
                        <span class="upload-loader" aria-hidden="true"></span>
                        <input id="file-input" type="file" hidden>
                    </label>
                    <div id="file-actions" class="file-actions" hidden>
                        <span id="file-name" class="file-name"></span>
                        <a id="download-file" class="action-button" href="#">Download</a>
                        <button id="delete-file" class="action-button danger-button" type="button">Delete</button>
                    </div>
                </div>
            </header>

            <form class="editor-form{% if locked %} is-locked{% endif %}" onsubmit="return false;">
                {% csrf_token %}
                <div id="lock-panel" class="lock-panel"{% if not locked %} hidden{% endif %}>
                    <div class="lock-dialog">
                        <strong>Locked note</strong>
                        <div class="unlock-row">
                            <span class="password-field unlock-password-field">
                                <input
                                    id="unlock-password"
                                    class="password-input"
                                    type="password"
                                    placeholder="Enter password"
                                    autocomplete="current-password"
                                    aria-label="Unlock password"
                                >
                                <button class="password-eye" type="button" data-password-toggle="unlock-password" aria-label="Show password" title="Show password">
                                    <svg viewBox="0 0 24 24" aria-hidden="true">
                                        <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
                                        <circle cx="12" cy="12" r="2.5"/>
                                    </svg>
                                </button>
                            </span>
                            <button id="unlock-note" class="action-button primary-action" type="button">Unlock</button>
                        </div>
                        <span id="lock-message" class="lock-message" role="status" aria-live="polite"></span>
                    </div>
                </div>
                <div class="editor-wrap">
                    <div id="search-highlights" class="search-highlights" aria-hidden="true"></div>
                    <textarea
                        id="note-editor"
                        class="editor"
                        data-api-url="{% url 'note_api' slug=note.slug %}"
                        data-file-url="{% url 'note_file' slug=note.slug %}"
                        data-unlock-url="{% url 'note_unlock' slug=note.slug %}"
                        data-password-url="{% url 'note_password' slug=note.slug %}"
                        data-history-url="{% url 'note_history' slug=note.slug %}"
                        data-locked="{% if locked %}true{% else %}false{% endif %}"
                        data-has-password="{% if has_password %}true{% else %}false{% endif %}"
                        data-updated-at="{{ note.updated_at|date:'c' }}"
                        aria-label="Note content"
                        autocomplete="off"
                        autocapitalize="off"
                        spellcheck="false"
                        {% if not locked %}autofocus{% else %}disabled{% endif %}
                        placeholder="Start writing..."
                    >{% if not locked %}{{ note.content }}{% endif %}</textarea>
                </div>
            </form>

            <footer class="note-footer">
                <span id="file-status" class="file-status" role="status" aria-live="polite"></span>
                <span id="line-count-wrap">Lines: <strong id="line-count">0 / 2000</strong></span>
                <span class="footer-divider" aria-hidden="true"></span>
                <span>Words: <strong id="word-count">0</strong></span>
                <span class="footer-divider" aria-hidden="true"></span>
                <span>Characters: <strong id="character-count">0</strong></span>
            </footer>
        </section>
    </main>
    <script src="{% static 'myapp/note.js' %}"></script>
</body>
</html>
